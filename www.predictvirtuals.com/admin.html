<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#05070a"/><meta name="robots" content="noindex, nofollow"/>
<title>Admin — Predict Virtuals</title>
<link rel="icon" href="/icon.svg"/>
<style>
  :root{--bg:#05070a;--panel:#0b0e13;--line:#1f242c;--text:#fff;--muted:#8b93a1;--lime:#a3e635;--green:#10b981;--cyan:#22d3ee;--red:#f87171;--amber:#fbbf24}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--lime)}
  .glow{position:fixed;top:-140px;left:20%;width:420px;height:420px;border-radius:50%;background:rgba(132,204,22,.12);filter:blur(110px);pointer-events:none;z-index:-1}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;text-decoration:none;color:#fff}
  .brand b{color:var(--lime)} .brand small{font:600 11px ui-monospace,monospace;color:var(--cyan);letter-spacing:.12em;margin-left:6px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#a3e635,#059669);display:grid;place-items:center;box-shadow:0 0 20px -4px rgba(163,230,53,.8)}
  .logo i{width:16px;height:16px;border-radius:4px;background:#000;display:block}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
  nav button:hover{color:#fff} nav button.on{background:#141a12;color:var(--lime)}
  .who{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  main{max-width:1100px;margin:0 auto;padding:28px 24px 80px}
  h1{font-size:26px;margin:0 0 4px;font-weight:800} .sub{color:var(--muted);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:22px}
  .stat .k{font:600 11px ui-monospace,monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .stat .v{font-size:28px;font-weight:800;margin-top:6px} .stat .n{color:var(--muted);font-size:12px;margin-top:2px}
  .stat.warn .v{color:var(--amber)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  input,select,textarea{background:#0f1319;border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px 12px;font:inherit;min-width:0}
  input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(163,230,53,.5);box-shadow:0 0 0 2px rgba(163,230,53,.15)}
  .bar input[type=search]{flex:1;min-width:200px}
  .btn{border:1px solid var(--line);background:#12161c;color:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
  .btn:hover{border-color:#39414d}
  .btn.primary{background:linear-gradient(90deg,#a3e635,#10b981);color:#000;border-color:transparent}
  .btn.danger{color:var(--red);border-color:rgba(248,113,113,.35)} .btn:disabled{opacity:.45;cursor:not-allowed}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:640px}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font:600 11px ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  tr:last-child td{border-bottom:0} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td .m{color:var(--muted);font-size:12px} td.mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--muted)}
  .pill.ok{color:var(--lime);border-color:rgba(163,230,53,.35)} .pill.bad{color:var(--red);border-color:rgba(248,113,113,.35)}
  .pill.wait{color:var(--amber);border-color:rgba(251,191,36,.35)} .pill.admin{color:var(--cyan);border-color:rgba(34,211,238,.35)}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  .note{color:var(--muted);font-size:12px;margin:10px 2px}
  .msg{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
  .msg.err{border:1px solid rgba(248,113,113,.25);background:rgba(248,113,113,.06);color:var(--red)}
  .msg.okm{border:1px solid rgba(163,230,53,.25);background:rgba(163,230,53,.06);color:var(--lime)}
  .login{max-width:420px;margin:60px auto 0}
  .login form,.stack{display:flex;flex-direction:column;gap:14px}
  label{display:flex;flex-direction:column;gap:6px;font-weight:600} label span.h{font-weight:400;color:var(--muted);font-size:12px}
  dialog{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:20px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  .dlg{padding:22px;display:flex;flex-direction:column;gap:18px;overflow:auto}
  .dlg h2{margin:0;font-size:20px} .dlg section{border-top:1px solid var(--line);padding-top:16px}
  .dlg h3{margin:0 0 10px;font-size:13px;font-family:ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1 1 140px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0} dt{color:var(--muted)} dd{margin:0;word-break:break-all}
  input.pin{font:600 26px ui-monospace,monospace;letter-spacing:.45em;text-align:center;padding:14px 12px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header class="top">
  <a class="brand" href="/admin"><span class="logo"><i></i></span><span>PREDICT <b>VIRTUALS</b></span><small>ADMIN</small></a>
  <nav id="nav" class="hidden"></nav>
  <div id="who" class="who hidden"></div>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<dialog id="dlg"></dialog>
<script src="/admin.js"></script>
</body>
</html>
