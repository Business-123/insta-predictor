<html lang="en" class="geist_a71539c9-module__T19VSG__variable geist_mono_8d43a2aa-module__8Li5zG__variable h-full antialiased">

  .pv-spin{width:1rem;height:1rem;border-radius:9999px;border:2px solid rgba(0,0,0,.25);border-top-color:#000;display:inline-block;animation:pvspin .7s linear infinite;vertical-align:-2px;margin-right:.5rem}
  @keyframes pvspin{to{transform:rotate(360deg)}}
  .break-all{word-break:break-all}
  #pv-card button:disabled{opacity:.6;cursor:not-allowed}

<body class="flex min-h-full flex-col bg-[#05070a] font-sans text-white">
<div aria-hidden="true" class="bg-scanlines pointer-events-none fixed inset-0 z-50 opacity-40"></div>
<div class="relative flex flex-1 flex-col overflow-x-clip">
<div class="pointer-events-none absolute -top-32 left-1/4 -z-10 h-[420px] w-[420px] rounded-full bg-lime-500/12 blur-[110px]"></div>
<div class="pointer-events-none absolute top-40 right-0 -z-10 h-[380px] w-[380px] rounded-full bg-cyan-600/12 blur-[110px]"></div>
<header class="flex items-center justify-between px-6 py-6 sm:px-10"><a class="flex items-center gap-2.5" href="/"><span class="flex shrink-0 items-center justify-center rounded-lg bg-linear-to-br from-lime-400 to-emerald-600 shadow-[0_0_20px_-4px_rgba(163,230,53,0.8)] h-8 w-8"><svg viewBox="0 0 24 24" fill="none" class="h-[70%] w-[70%]"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" class="fill-black"></rect><circle cx="8.2" cy="8.2" r="2.3" class="fill-lime-400"></circle><circle cx="15.8" cy="8.2" r="2.3" class="fill-lime-400"></circle><circle cx="8.2" cy="15.8" r="2.3" class="fill-lime-400"></circle><circle cx="15.8" cy="15.8" r="2.3" class="fill-lime-400"></circle><circle cx="12" cy="12" r="2.3" class="fill-lime-400"></circle></svg></span><span class="text-lg font-extrabold tracking-tight text-white">PREDICT <span class="text-lime-400">VIRTUALS</span></span></a><a class="flex items-center gap-1.5 font-mono text-sm text-zinc-400 transition-colors hover:text-lime-300" href="/"><svg viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4"><path fill-rule="evenodd" d="M17 10a.75.75 0 01-.75.75H5.56l4.22 4.22a.75.75 0 11-1.06 1.06l-5.5-5.5a.75.75 0 010-1.06l5.5-5.5a.75.75 0 111.06 1.06L5.56 9.25H16.25A.75.75 0 0117 10z" clip-rule="evenodd"></path></svg>Back to home</a></header>
<main class="flex flex-1 flex-col px-6 pb-24 pt-6 sm:px-10">
  <div class="mx-auto w-full max-w-lg text-center">
    <p class="font-mono text-xs font-bold tracking-widest text-lime-400">// TOKEN PURCHASE</p>
    <h1 id="pv-title" class="mt-3 text-4xl font-extrabold text-white sm:text-5xl">Checkout</h1>
    <p id="pv-sub" class="mx-auto mt-4 max-w-sm text-sm leading-relaxed text-zinc-400"></p>
  </div>
  <div id="pv-card" class="mx-auto mt-10 w-full max-w-lg"><div class="h-64 animate-pulse rounded-3xl bg-zinc-900/40"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function () {
  // Same Firebase project as the rest of the site, so the existing sign-in carries over.
  firebase.initializeApp({
    apiKey: "AIzaSyAdDnH2VO3yUelaBZy9chxpXvX7g4QztIQ", authDomain: "predict-virtuals.firebaseapp.com",
    projectId: "predict-virtuals", storageBucket: "predict-virtuals.firebasestorage.app",
    messagingSenderId: "185234794048", appId: "1:185234794048:web:d468972faf7b54c1a6a1a5"
  });
  // Display only. The server owns the real prices and token amounts.
  var PLANS = {
    gold: { tier: "Gold", price: 300, tokens: 1000, text: "text-amber-300" },
    platinum: { tier: "Platinum", price: 500, tokens: 2000, text: "text-cyan-300" },
    diamond: { tier: "Diamond", price: 1000, tokens: 5000, text: "text-lime-300" }
  };
  var q = new URLSearchParams(location.search);
  var planSlug = (q.get("plan") || "").toLowerCase();
  var payment = q.get("payment");
  var reference = q.get("reference") || "";
  var card = document.getElementById("pv-card");
  var title = document.getElementById("pv-title");
  var sub = document.getElementById("pv-sub");
  var unsubscribeBalance = null;

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function box() { card.textContent = ""; var b = el("div", "rounded-3xl border border-zinc-800 bg-zinc-950/60 p-6 text-center"); card.appendChild(b); return b; }
  function linkBtn(href, label, primary) {
    var a = el("a", primary
      ? "mt-6 block rounded-full bg-linear-to-r from-lime-400 to-emerald-500 px-4 py-3 text-center text-sm font-semibold text-black"
      : "mt-3 block rounded-xl border border-zinc-800 px-4 py-3 text-center text-sm font-semibold text-white hover:border-lime-500/40 hover:bg-white/5", label);
    a.href = href; return a;
  }
  function balanceLine(parent, uid) {
    var line = el("p", "mt-4 font-mono text-sm text-zinc-400", "Your balance: ");
    var val = el("span", "text-lime-300", "…"); line.appendChild(val); parent.appendChild(line);
    if (unsubscribeBalance) unsubscribeBalance();
    unsubscribeBalance = firebase.firestore().collection("users").doc(uid).onSnapshot(function (s) {
      val.textContent = ((s.exists && s.data().tokenBalance) || 0).toLocaleString() + " tokens";
    }, function () { val.textContent = "unavailable"; });
  }

  // ---- Result screens (customer is back from the hub) --------------------------------
  function showResult(user) {
    var b = box();
    var copy = {
      success: ["Payment received", "Your tokens have been added.", "text-lime-300"],
      pending: ["Confirming payment…", "This usually takes a few seconds. Please keep this page open.", "text-amber-300"],
      failed: ["Payment failed", "You were not charged. You can try again whenever you like.", "text-red-400"],
      expired: ["Payment expired", "That checkout timed out. Start again to buy tokens.", "text-red-400"],
      review: ["Payment under review", "We received your payment but need to check it. Contact support and we will sort it out quickly.", "text-amber-300"],
      error: ["Something went wrong", "We could not confirm this payment. If you were charged, contact support with your payment reference.", "text-red-400"]
    };
    var c = copy[payment] || copy.error;
    title.textContent = c[0]; sub.textContent = c[1];
    var plan = PLANS[planSlug];
    if (plan) b.appendChild(el("p", "font-mono text-xs font-bold tracking-widest uppercase " + plan.text, plan.tier + " · " + plan.tokens.toLocaleString() + " tokens"));
    if (reference) b.appendChild(el("p", "mt-2 break-all font-mono text-xs text-zinc-500", "Reference: " + reference));
    if (user && (payment === "success" || payment === "pending")) balanceLine(b, user.uid);
    if (payment === "success") b.appendChild(linkBtn("/predict", "Start predicting", true));
    else if (payment !== "pending") b.appendChild(linkBtn("/plans", "Back to plans", true));
    if (payment === "pending" && reference) poll(b);
  }
  function poll(b) {
    var tries = 0;
    (function tick() {
      fetch("/api/deposit/" + encodeURIComponent(reference) + "/complete", { method: "POST" })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (r) {
          var next = r.d && r.d.redirect && new URL(r.d.redirect, location.href).searchParams.get("payment");
          if (next && next !== "pending") { var u = new URL(location.href); u.searchParams.set("payment", next); location.replace(u.toString()); return; }
          if (++tries < 40) setTimeout(tick, 3000); else b.appendChild(el("p", "mt-4 text-sm text-amber-300", "Still confirming. You can close this page; your tokens will be added automatically once the payment clears."));
        })
        .catch(function () { if (++tries < 40) setTimeout(tick, 3000); });
    })();
  }

  // ---- Checkout screen ---------------------------------------------------------------
  function showCheckout(user) {
    var plan = PLANS[planSlug];
    if (!plan) {
      title.textContent = "Choose a plan"; sub.textContent = "Pick a token plan to continue.";
      var b0 = box(); b0.appendChild(linkBtn("/plans", "See token plans", true)); return;
    }
    title.textContent = "Buy " + plan.tier + " tokens";
    sub.textContent = "One-time payment. No subscription, no expiry.";
    var b = box();
    b.appendChild(el("p", "font-mono text-xs font-bold tracking-widest uppercase " + plan.text, plan.tier));
    b.appendChild(el("div", "mt-4 text-4xl font-extrabold text-white", "GHS " + plan.price));
    b.appendChild(el("p", "mt-1 text-sm text-zinc-500", "one-time payment"));
    b.appendChild(el("div", "mt-6 text-lg font-bold text-white", plan.tokens.toLocaleString() + " tokens"));
    b.appendChild(el("p", "mt-1 font-mono text-xs text-zinc-500", "GHS " + (plan.price / plan.tokens).toFixed(2) + " / token"));
    balanceLine(b, user.uid);
    var err = el("p", "mt-4 hidden text-sm text-red-400"); err.setAttribute("role", "alert");
    var btn = el("button", "mt-6 block w-full rounded-full bg-linear-to-r from-lime-400 to-emerald-500 px-4 py-3 text-center text-sm font-semibold text-black shadow-[0_0_24px_-8px_rgba(163,230,53,0.9)]", "Pay GHS " + plan.price);
    btn.type = "button";
    btn.addEventListener("click", function () {
      btn.disabled = true; err.classList.add("hidden");
      btn.textContent = ""; btn.appendChild(el("span", "pv-spin")); btn.appendChild(document.createTextNode("Opening secure checkout…"));
      user.getIdToken().then(function (token) {
        return fetch("/api/deposit/initialize", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ plan: planSlug }) });
      }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || "Could not start checkout."); return d; }); })
        .then(function (d) {
          if (!/^https?:\/\//i.test(d.checkoutUrl || "")) throw new Error("Checkout link was invalid. Please try again.");
          location.href = d.checkoutUrl;
        })
        .catch(function (e) { err.textContent = e.message; err.classList.remove("hidden"); btn.disabled = false; btn.textContent = "Pay GHS " + plan.price; });
    });
    b.appendChild(err); b.appendChild(btn);
    b.appendChild(linkBtn("/plans", "Choose a different plan", false));
  }

  firebase.auth().onAuthStateChanged(function (user) {
    if (!user) {
      var here = location.pathname + location.search;
      location.replace("/login?next=" + encodeURIComponent(here)); return;
    }
    if (payment) showResult(user); else showCheckout(user);
  });
})();
</script>
</body>
</html>
